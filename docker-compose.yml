services:
  mysql:
    image: mysql:8.4
    command: --innodb-buffer-pool-size=256M
    mem_limit: 768m
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jobs}
      MYSQL_USER: ${MYSQL_USER:-jobs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jobs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports: ["3306:3306"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, timeout: 5s, retries: 20 }
  api:
    build: .
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/jobs?createDatabaseIfNotExist=true&serverTimezone=UTC}
      DB_USERNAME: ${MYSQL_USER:-jobs}
      DB_PASSWORD: ${MYSQL_PASSWORD:-jobs}
      API_ENABLED: "true"
      WORKER_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC -XX:MaxRAMPercentage=65"
    mem_limit: 384m
    ports: ["8080:8080"]
    depends_on: { mysql: { condition: service_healthy } }
  worker:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/jobs?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-jobs}
      DB_PASSWORD: ${MYSQL_PASSWORD:-jobs}
      API_ENABLED: "false"
      WORKER_ENABLED: "true"
      WORKER_ID: worker-$${HOSTNAME}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-5}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC -XX:MaxRAMPercentage=65"
    mem_limit: 384m
    depends_on: { mysql: { condition: service_healthy } }
  prometheus:
    image: prom/prometheus:v3.5.0
    mem_limit: 256m
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [api, worker]
  grafana:
    image: grafana/grafana:12.1.1
    mem_limit: 256m
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
