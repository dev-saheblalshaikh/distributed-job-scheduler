spring:
  application:
    name: distributed-job-scheduler
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jobs?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:jobs}
    password: ${DB_PASSWORD:jobs}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
management.endpoints.web.exposure.include: health,info,prometheus
api:
  enabled: ${API_ENABLED:true}
demo:
  enabled: ${DEMO_ENABLED:false}
  trust-proxy-header: ${DEMO_TRUST_PROXY_HEADER:false}
  per-client-burst-seconds: ${DEMO_PER_CLIENT_BURST_SECONDS:3}
  per-client-hourly-limit: ${DEMO_PER_CLIENT_HOURLY_LIMIT:30}
  global-pending-running-cap: ${DEMO_GLOBAL_PENDING_RUNNING_CAP:60}
  cleanup-interval-ms: ${DEMO_CLEANUP_INTERVAL_MS:300000}
worker:
  enabled: ${WORKER_ENABLED:true}
  id: ${WORKER_ID:worker-1}
  batch-size: ${WORKER_BATCH_SIZE:5}
  lease-seconds: ${WORKER_LEASE_SECONDS:30}
  retry:
    base-delay-seconds: ${WORKER_RETRY_BASE_DELAY_SECONDS:2}
    max-delay-seconds: ${WORKER_RETRY_MAX_DELAY_SECONDS:300}
  poll-interval-ms: ${WORKER_POLL_INTERVAL_MS:1000}
  recovery-interval-ms: ${WORKER_RECOVERY_INTERVAL_MS:10000}
springdoc.swagger-ui.path: /swagger-ui.html
