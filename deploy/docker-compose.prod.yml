services:
  mysql:
    # Compose appends lists from override files unless you reset or override them.
    ports: !reset []
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  api:
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8080:8080"

  worker:
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

  prometheus:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:9090:9090"

  grafana:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}

volumes:
  mysql-data:
